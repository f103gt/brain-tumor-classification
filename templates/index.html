<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Image Classification</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .model-card {
            cursor: pointer;
            transition: all 0.3s;
            height: 100%; /* Ensure equal height */
        }
        .model-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .model-card.active {
            border: 3px solid #0d6efd;
        }
        #resultContainer {
            display: none;
        }
        .danger-result {
            background-color: #f8d7da !important;
            border-color: #f5c6cb !important;
            color: #721c24 !important;
        }
        .normal-result {
            background-color: #d4edda !important;
            border-color: #c3e6cb !important;
            color: #155724 !important;
        }
        .card-body {
            padding: 1.5rem; /* Consistent padding */
        }
    </style>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-4">
                    <h1 class="text-center mb-4">Medical Image Classification</h1>
                    
                    <div class="row mb-4">
                        <div class="col-md-6 mb-3">
                            <div class="card model-card p-3 text-center h-100" id="brainTumorCard" onclick="selectModel('brain_tumor')">
                                <div class="card-body">
                                    <h4>Brain Tumor Classifier</h4>
                                    <p class="text-muted">Classify MRI scans into Glioma, Meningioma, No Tumor, or Pituitary tumor</p>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <div class="card model-card p-3 text-center h-100" id="pneumoniaCard" onclick="selectModel('pneumonia')">
                                <div class="card-body">
                                    <h4>Pneumonia Detector</h4>
                                    <p class="text-muted">Detect Pneumonia from chest X-ray images</p>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <form id="predictionForm" enctype="multipart/form-data">
                        <input type="hidden" name="model_type" id="modelType" value="brain_tumor">
                        
                        <div class="mb-3">
                            <label for="file" class="form-label">Upload Medical Image:</label>
                            <input type="file" class="form-control" name="file" id="file" required>
                            <div class="form-text" id="modelDescription">Please upload a brain MRI scan for tumor classification</div>
                        </div>
                        
                        <div class="text-center">
                            <button type="submit" class="btn btn-primary">Predict</button>
                        </div>
                    </form>
                    
                    <div id="resultContainer" class="mt-4">
                        <div class="alert" id="resultAlert">
                            <h4 class="alert-heading" id="resultTitle">Prediction Result</h4>
                            <p id="resultText"></p>
                            <hr>
                            <p class="mb-0" id="modelUsed"></p>
                        </div>
                    </div>
                    
                    <div id="loadingSpinner" class="text-center mt-4" style="display: none;">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                        <p class="mt-2">Processing image...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let selectedModel = 'brain_tumor';
        
        function selectModel(modelType) {
            selectedModel = modelType;
            document.getElementById('modelType').value = modelType;
            
            document.getElementById('brainTumorCard').classList.remove('active');
            document.getElementById('pneumoniaCard').classList.remove('active');
            document.getElementById(modelType + 'Card').classList.add('active');
            
            const descriptions = {
                'brain_tumor': 'Please upload a brain MRI scan for tumor classification',
                'pneumonia': 'Please upload a chest X-ray image for pneumonia detection'
            };
            document.getElementById('modelDescription').textContent = descriptions[modelType];
        }
        
        function formatPrediction(prediction, modelType) {
            if (modelType === 'brain_tumor') {
                if (prediction === 'notumor') return 'No Tumor';
                return prediction.charAt(0).toUpperCase() + prediction.slice(1);
            } else {
                if (prediction === 'NORMAL') return 'No Pneumonia';
                return 'Pneumonia Detected';
            }
        }
        
        function isNormalResult(prediction, modelType) {
            if (modelType === 'brain_tumor') return prediction === 'notumor';
            return prediction === 'NORMAL';
        }
        
        document.getElementById('predictionForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const fileInput = document.getElementById('file');
            
            if (!fileInput.files.length) {
                alert('Please select an image file');
                return;
            }
            
            document.getElementById('loadingSpinner').style.display = 'block';
            document.getElementById('resultContainer').style.display = 'none';
            
            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    throw new Error(data.error);
                }

                const formattedPrediction = formatPrediction(data.predicted_class, selectedModel);
                const isNormal = isNormalResult(data.predicted_class, selectedModel);
                
                const resultAlert = document.getElementById('resultAlert');
                resultAlert.className = isNormal ? 'alert normal-result' : 'alert danger-result';
                
                document.getElementById('resultText').textContent = `Prediction: ${formattedPrediction}`;
                document.getElementById('modelUsed').textContent = `Model used: ${selectedModel === 'brain_tumor' ? 'Brain Tumor Classifier' : 'Pneumonia Detector'}`;
                document.getElementById('resultContainer').style.display = 'block';
            })
            .catch(error => {
                alert('Error: ' + error.message);
            })
            .finally(() => {
                document.getElementById('loadingSpinner').style.display = 'none';
            });
        });
        
        document.getElementById('brainTumorCard').classList.add('active');
    </script>
</body>
</html>
